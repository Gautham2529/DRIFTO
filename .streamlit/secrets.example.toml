# Copy this file to .streamlit/secrets.toml and replace every placeholder.
# Never commit the real secrets.toml file.

[auth]
# Use the local URI for development. Set the Streamlit Community Cloud URI
# when configuring the hosted app's secrets.
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "REPLACE_WITH_A_LONG_RANDOM_SECRET"

[auth.auth0]
client_id = "REPLACE_WITH_AUTH0_CLIENT_ID"
client_secret = "REPLACE_WITH_AUTH0_CLIENT_SECRET"
server_metadata_url = "https://REPLACE_WITH_AUTH0_DOMAIN/.well-known/openid-configuration"
